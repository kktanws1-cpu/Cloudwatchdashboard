AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Single EC2 instance running Mailpit (fake SMTP server + web UI) for
  capturing test emails, deployed in the Management tier. The web UI
  (port 8025) is reached via the existing Common Services Frontend ALB
  (the same shared ALB used by the other applications) through a
  host-based routing rule pointing at this instance's target group —
  no dedicated CloudFront distribution or public IP is used.
  Instance management is via AWS Systems Manager Session Manager.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC of the Management tier (same VPC as the Common Services Frontend ALB).

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet in the Management tier to launch the instance into.

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t2.micro
    Description: EC2 instance size. t3.micro is sufficient for Mailpit.

  ExistingAlbListenerArn:
    Type: String
    Description: >
      ARN of the existing HTTPS listener on the Common Services Frontend ALB
      (Web Tier). A new host-based rule is added to this listener to route
      Mailpit's hostname to this instance's target group.

  ExistingAlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: >
      Security group attached to the Common Services Frontend ALB. Used to
      restrict inbound port 8025 on the Mailpit instance to traffic from
      that ALB only.

  MailpitHostname:
    Type: String
    Description: >
      Internal hostname used for host-based routing on the shared ALB,
      e.g. www.mailpit.judiciary.sg (internal DNS, not internet-resolvable).

  ListenerRulePriority:
    Type: Number
    Description: >
      Priority for the new listener rule on the shared ALB. Must not
      collide with any existing rule priority on that listener.

  SmtpAllowedCidr:
    Type: String
    Description: >
      CIDR block allowed to send test SMTP traffic to port 1025
      (the apps/servers under test that relay emails to Mailpit).
      e.g. 10.0.0.0/8 for the internal VPC range.
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

  VolumeSize:
    Type: Number
    Default: 8
    Description: Root EBS volume size in GB (used to persist captured emails).

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  MailpitSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow the shared Frontend ALB to Mailpit web UI, and internal SMTP
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8025
          ToPort: 8025
          SourceSecurityGroupId: !Ref ExistingAlbSecurityGroupId
          Description: Mailpit web UI - Common Services Frontend ALB only
        - IpProtocol: tcp
          FromPort: 1025
          ToPort: 1025
          CidrIp: !Ref SmtpAllowedCidr
          Description: SMTP test traffic from internal apps
      Tags:
        - Key: Name
          Value: mailpit-sg

  MailpitInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  MailpitInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref MailpitInstanceRole

  MailpitInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref SubnetId
      IamInstanceProfile: !Ref MailpitInstanceProfile
      SecurityGroupIds:
        - !Ref MailpitSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: mailpit
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -eux
          dnf update -y
          dnf install -y docker
          systemctl enable --now docker
          mkdir -p /opt/mailpit/data
          docker run -d \
            --name mailpit \
            --restart unless-stopped \
            -p 8025:8025 \
            -p 1025:1025 \
            -v /opt/mailpit/data:/data \
            -e MP_DATABASE=/data/mailpit.db \
            axllent/mailpit:latest

  MailpitTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: mailpit-tg
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8025
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Targets:
        - Id: !Ref MailpitInstance
          Port: 8025
      Tags:
        - Key: Name
          Value: mailpit-tg

  MailpitListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ExistingAlbListenerArn
      Priority: !Ref ListenerRulePriority
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - !Ref MailpitHostname
      Actions:
        - Type: forward
          TargetGroupArn: !Ref MailpitTargetGroup

Outputs:
  TargetGroupArn:
    Description: ARN of the Mailpit target group, for reference on the shared ALB listener rule.
    Value: !Ref MailpitTargetGroup

  ListenerRuleArn:
    Description: ARN of the listener rule added to the Common Services Frontend ALB.
    Value: !Ref MailpitListenerRule

  SmtpEndpoint:
    Description: SMTP endpoint for sending test emails (no authentication required), private IP only.
    Value: !Sub '${MailpitInstance.PrivateIp}:1025'

  InstanceId:
    Description: EC2 instance ID
    Value: !Ref MailpitInstance

  SsmConnectCommand:
    Description: Command to open a shell on the instance via Session Manager
    Value: !Sub 'aws ssm start-session --target ${MailpitInstance}'
